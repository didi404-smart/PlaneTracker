[project]
name = "planetracker"
version = "0.1.0"
description = ""
authors = [
    {name = "Diana Paramonova",email = "dparamonova638@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "requests (>=2.34.2,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
# Максимальная длина строки
line-length = 119

[tool.flake8]
# Максимальная длина строки
max-line-length = 119

[tool.isort]
# максимальная длина строки
line_length = 119

[tool.poetry]
package-mode = false

[dependency-groups]
lint = [
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "flake8 (>=7.5.0,<8.0.0)"
]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.coverage.run]
omit = ["tests/*"]